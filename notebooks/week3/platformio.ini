; PlatformIO config for Week 3.
; Open the notebooks/week3 folder in Cursor, then use the PlatformIO
; Build / Upload / Serial Monitor buttons in the bottom status bar.
;
; To build a different sketch, change src_dir to its folder:
;   week3_scan     Step 1
;   week3_led      Step 2 and Step 3 (default)
;   week3_answers  filled-in Step 2

[platformio]
src_dir = week3_led

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = adafruit/Adafruit MLX90393
monitor_speed = 115200
upload_speed = 921600
