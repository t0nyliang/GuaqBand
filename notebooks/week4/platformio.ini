; PlatformIO config for Week 4.
; Open the notebooks/week4 folder in Cursor, then use the PlatformIO
; Build / Upload / Serial Monitor buttons in the bottom status bar.
;
; To build a different sketch, change src_dir to its folder:
;   week4_colors   Step 1 (default)
;   week4_multi    Step 2 and Step 3
;   week4_answers  filled-in Step 2 (includes every Step 1 answer)

[platformio]
src_dir = week4_colors

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    adafruit/Adafruit MLX90393
    adafruit/Adafruit NeoPixel
monitor_speed = 115200
upload_speed = 921600
