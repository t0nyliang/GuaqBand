; Open this repository in VS Code or Cursor with PlatformIO IDE.
; Use PlatformIO: Upload to flash the magnetic sensor firmware.
[platformio]
src_dir = mlx90393_live

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = adafruit/Adafruit MLX90393
monitor_speed = 115200
upload_speed = 460800
; PlatformIO detects the connected board's upload port automatically.
; If needed, override it with: pio run -t upload --upload-port YOUR_PORT
